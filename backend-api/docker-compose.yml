# ============================================================
# SafeSkin AI – Docker Compose
# Usage:
#   docker compose up --build        (start)
#   docker compose down              (stop)
#   docker compose logs -f api       (stream logs)
# ============================================================

version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safeskin-api
    restart: unless-stopped

    # Load environment variables from .env file
    env_file:
      - .env

    # Override specific vars for Docker networking
    environment:
      - ENVIRONMENT=production
      - MODEL_DIR=/app/models

    ports:
      - "8000:8000"

    volumes:
      # Mount local model files into the container (read-only)
      - ./models:/app/models:ro
      # Writable volume for Grad-CAM outputs
      - gradcam_output:/app/models/gradcam

    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (adjust for your deployment)
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: "4G"
        reservations:
          cpus: "0.5"
          memory: "512M"

volumes:
  gradcam_output:
    driver: local
